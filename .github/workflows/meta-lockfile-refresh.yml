name: Meta lockfile refresh

on:
  push:
    branches:
      - agent/meta-catalog-feed

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile for patched Next.js
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: meta-catalog-patched-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
