name: Meta lockfile refresh

on:
  push:
    branches:
      - agent/meta-catalog-feed

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.head_commit.message != 'ci: refresh lockfile for patched Next.js'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meta-catalog-feed
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile for patched Next.js
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "ci: refresh lockfile for patched Next.js"
          git push origin HEAD:agent/meta-catalog-feed
