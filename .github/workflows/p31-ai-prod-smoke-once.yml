name: P31 AI Production Smoke Once

on:
  push:
    branches:
      - agent/p31-hotfix-ai-persistence-await
    paths:
      - .github/workflows/p31-ai-prod-smoke-once.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call production concierge once
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            --request POST \
            --header 'content-type: application/json' \
            --dump-header headers.txt \
            --output response.json \
            --data '{"message":"Recommend one cold SALORA drink that is not too sweet. Use only the published menu.","channel":"web","locale":"en"}' \
            https://salora-platform.vercel.app/api/ai/concierge

      - name: Verify authority headers and AI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -qi '^x-salora-menu-revision:' headers.txt
          grep -qi '^x-salora-menu-version:' headers.txt
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          const data = body.data ?? body;
          if (!data.answer || typeof data.answer !== 'string') throw new Error('Missing AI answer');
          if (!data.correlationId || typeof data.correlationId !== 'string') throw new Error('Missing correlationId');
          if (!data.provider?.provider || !data.provider?.model) throw new Error('Missing provider metadata');
          if (data.safety?.blocked === true) throw new Error('Smoke request was unexpectedly safety-blocked');
          if (typeof data.evaluation?.score !== 'number') throw new Error('Missing evaluation score');
          console.log(`CORRELATION_ID=${data.correlationId}`);
          console.log(`PROVIDER=${data.provider.provider}`);
          console.log(`MODEL=${data.provider.model}`);
          console.log(`EVALUATION_SCORE=${data.evaluation.score}`);
          NODE
