name: SALORA Release Validation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-check:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:3000
      TIMEOUT_MS: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm start:web > salora-web.log 2>&1 &
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salora-release-logs
          path: salora-web.log
