name: SALORA CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level critical

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salora/mobile typecheck

  p22c3b:
    name: P22C-3B isolated PostgreSQL 17
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/p22c-3b-github-actions-postgres17'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      P22C3B_APPROVED_SHA: 9dc141be031edc4956b59c0a89c8de10fadadfff0cac57168a150ff80e4b97c4
      P22C3B_REPORT_PATH: ${{ runner.temp }}/p22c3b-certification.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Verify PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Validate P22C-3B contract
        run: node scripts/p22c3b-certify.mjs --contract-only

      - name: Certify schema and rollback
        run: node scripts/p22c3b-certify.mjs

      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p22c3b-postgres17-certification
          path: ${{ runner.temp }}/p22c3b-certification.json
          if-no-files-found: warn
          retention-days: 14
