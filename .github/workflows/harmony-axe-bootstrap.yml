name: Harmony axe bootstrap
on:
  push:
    branches: [feature/harmony-customer-onboarding]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/harmony-customer-onboarding
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -Dw @axe-core/playwright@4.13.0
      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Commit pnpm-generated dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harmony-axe-bootstrap.yml
          git add package.json pnpm-lock.yaml
          git commit -m "Add Harmony Playwright accessibility gate dependency"
          git push origin HEAD:feature/harmony-customer-onboarding
