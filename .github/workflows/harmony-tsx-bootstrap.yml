name: Harmony tsx bootstrap
on:
  push:
    branches: [feature/harmony-customer-onboarding]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/harmony-customer-onboarding
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -Dw tsx@4.23.13
      - run: pnpm install --frozen-lockfile
      - name: Commit pnpm-generated test runner update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harmony-tsx-bootstrap.yml
          git add package.json pnpm-lock.yaml
          git commit -m "Add TypeScript runner for Harmony integration proof"
          git push origin HEAD:feature/harmony-customer-onboarding
